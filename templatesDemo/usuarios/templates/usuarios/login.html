{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Tienda Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <h3 class="card-title mb-3">Iniciar sesión</h3>
              {% if form.errors %}
                <div class="alert alert-danger">Usuario o contraseña inválidos.</div>
              {% endif %}
              <form method="post" action="{% url 'usuarios:login' %}">
                {% csrf_token %}
                {% if next %}
                  <input type="hidden" name="next" value="{{ next }}">
                {% endif %}
                <div class="mb-3">
                  <label for="id_username" class="form-label">Usuario</label>
                  <input type="text" name="username" autofocus class="form-control" id="id_username" value="{{ request.POST.username }}">
                </div>
                <div class="mb-3">
                  <label for="id_password" class="form-label">Contraseña</label>
                  <input type="password" name="password" class="form-control" id="id_password">
                </div>
                <div class="d-flex justify-content-between align-items-center">
                  <a href="{% url 'usuarios:registro' %}">¿No tienes cuenta? Regístrate</a>
                  <button class="btn btn-primary">Entrar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
